apiVersion: v1
kind: Service
metadata:
  name: heart-api-service
  labels:
    app: heart-api
spec:
  # On GKE, type: LoadBalancer provisions a real external Google Cloud
  # network load balancer with a public IP (satisfies "expose via Load Balancer").
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - name: http
      protocol: TCP
      port: 80          # public port
      targetPort: 8000  # container port
