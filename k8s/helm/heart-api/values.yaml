replicaCount: 2

image:
  repository: heart-api
  tag: "1.0.0"
  pullPolicy: Never   # use the locally-built Minikube image; set to IfNotPresent for a registry

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

metrics:
  scrape: true
  port: "8000"
  path: "/metrics"
