global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "heart-api"
    metrics_path: /metrics
    static_configs:
      # When running via docker-compose, "heart-api" is the service name.
      # If Prometheus runs on the host instead, use host.docker.internal:8000.
      - targets: ["heart-api:8000"]
        labels:
          service: "heart-disease-api"
