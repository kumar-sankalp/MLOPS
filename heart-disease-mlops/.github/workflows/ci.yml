name: CI/CD Pipeline

# Runs on every push / PR to main. The pipeline FAILS (red) if linting or
# tests fail, satisfying the "pipeline must fail on code or test errors"
# requirement.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  lint-test-train:
    name: Lint, Test & Train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) LINTING -----------------------------------------------------------
      - name: Lint with flake8
        run: flake8 src api tests

      # 2) DATA + TRAIN ------------------------------------------------------
      # Download the dataset and train the model so tests have a real artifact
      # and so we validate the full pipeline end-to-end.
      - name: Download dataset
        run: python data/download_data.py

      - name: Train model (produces models/model.joblib)
        run: python -m src.train

      # 3) UNIT + INTEGRATION TESTS -----------------------------------------
      - name: Run tests with pytest
        run: pytest -v

      # 4) ARTIFACTS / LOGGING ----------------------------------------------
      - name: Upload trained model artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.joblib
            models/model_metadata.json
          retention-days: 14

      - name: Upload MLflow tracking artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlflow.db
            mlartifacts/
          retention-days: 14
          if-no-files-found: ignore

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint-test-train
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The model artifact from the previous job is needed to bake into the image.
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: heart-api:ci
          load: true

      - name: Smoke-test the container
        run: |
          docker run -d --name heart-api -p 8000:8000 heart-api:ci
          sleep 12
          curl -sf http://localhost:8000/health || (docker logs heart-api && exit 1)
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":3,"trestbps":145,"chol":233,"fbs":1,"restecg":0,"thalach":150,"exang":0,"oldpeak":2.3,"slope":0,"ca":0,"thal":1}'
          docker stop heart-api
