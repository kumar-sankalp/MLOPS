apiVersion: v1
kind: Service
metadata:
  name: heart-api-service
  labels:
    app: heart-api
spec:
  # LoadBalancer satisfies the "expose via Load Balancer" requirement.
  # On Minikube, run `minikube tunnel` (or `minikube service heart-api-service`)
  # to obtain an external IP / URL.
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - name: http
      protocol: TCP
      port: 80          # external port
      targetPort: 8000  # container port
